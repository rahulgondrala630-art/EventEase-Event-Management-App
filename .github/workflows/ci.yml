name: EventEase CI

on:
  push:
      branches:
            - main
                  - 'portfolio/**'
                    pull_request:

                    jobs:
                      verify:
                          runs-on: ubuntu-latest
                              steps:
                                    - uses: actions/checkout@v4
                                          - uses: actions/setup-java@v4
                                                  with:
                                                            distribution: temurin
                                                                      java-version: '17'
                                                                                cache: maven
                                                                                      - run: mvn -B test
                                                                                      
